name: Android CI
# Upstream review evidence changes must retain the shared offline QA gate.
# Normalization changes use the same mandatory case inventory.
# Collector changes retain the integrated offline QA requirement.
# Freshness changes preserve native integrated CI.
# Sealed watch changes preserve native integrated CI.
# Review plan changes preserve native integrated CI.
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/verify_android_apk.py', 'scripts/test_verify_android_apk.py', 'scripts/test_apk_failure_gates.sh', 'scripts/check_android_badging.py', 'scripts/test_check_android_badging.py', 'scripts/dependency_inventory.py', 'scripts/test_dependency_inventory.py', 'scripts/check_dependency_baseline.py', 'scripts/test_check_dependency_baseline.py', 'scripts/check_upstream_review.py', 'scripts/upstream_observation_adapter.py', 'scripts/collect_upstream_review.py', 'scripts/upstream_freshness.py', 'scripts/run_upstream_watch.py', 'scripts/run_upstream_watch_ci.py', 'scripts/upstream_review_plan.py', 'scripts/test_upstream_review_plan.py', 'scripts/test_run_upstream_watch_ci.py', 'scripts/test_run_upstream_watch.py', 'scripts/test_upstream_freshness.py', 'scripts/test_collect_upstream_review.py', 'scripts/test_upstream_observation_adapter.py', 'scripts/test_check_upstream_review.py', 'scripts/verify_upstream_review.py', 'scripts/test_verify_upstream_review.py', 'config/upstream-review-baseline.json', 'third-party/baselines/android-debug.cdx.json', 'scripts/check_gradle_verification.py', 'scripts/test_check_gradle_verification.py', 'scripts/test_gradle_checksum_gate.sh', 'scripts/dependency_license_evidence.py', 'scripts/test_dependency_license_evidence.py', 'scripts/artifact_manifest.py', 'scripts/test_artifact_manifest.py', 'scripts/build_source_evidence.py', 'scripts/test_build_source_evidence.py', 'scripts/code_audit.py', 'scripts/test_code_audit.py', 'scripts/run_offline_qa.py', 'scripts/test_run_offline_qa.py', 'scripts/qa_case_inventory.py', 'scripts/test_qa_case_inventory.py', 'scripts/verify_offline_qa.py', 'scripts/test_verify_offline_qa.py', 'scripts/plan_windows_maintenance.py', 'scripts/test_plan_windows_maintenance.py', 'scripts/backup_windows_selection.py', 'scripts/test_backup_windows_selection.py', 'scripts/restore_windows_selection.py', 'scripts/test_restore_windows_selection.py', 'scripts/windows_maintenance_lease.py', 'scripts/test_windows_maintenance_lease.py', 'scripts/smoke_maintenance_lease_interop.py', 'scripts/probe_maintenance_lease.py', 'scripts/test_probe_maintenance_lease.py', 'config/python-qa-cases.json', 'scripts/record_okhttp_bytecode.py', 'scripts/test_record_okhttp_bytecode.py', 'config/code-audit-baseline.json']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/verify_android_apk.py', 'scripts/test_verify_android_apk.py', 'scripts/test_apk_failure_gates.sh', 'scripts/check_android_badging.py', 'scripts/test_check_android_badging.py', 'scripts/dependency_inventory.py', 'scripts/test_dependency_inventory.py', 'scripts/check_dependency_baseline.py', 'scripts/test_check_dependency_baseline.py', 'scripts/check_upstream_review.py', 'scripts/upstream_observation_adapter.py', 'scripts/collect_upstream_review.py', 'scripts/upstream_freshness.py', 'scripts/run_upstream_watch.py', 'scripts/run_upstream_watch_ci.py', 'scripts/upstream_review_plan.py', 'scripts/test_upstream_review_plan.py', 'scripts/test_run_upstream_watch_ci.py', 'scripts/test_run_upstream_watch.py', 'scripts/test_upstream_freshness.py', 'scripts/test_collect_upstream_review.py', 'scripts/test_upstream_observation_adapter.py', 'scripts/test_check_upstream_review.py', 'scripts/verify_upstream_review.py', 'scripts/test_verify_upstream_review.py', 'config/upstream-review-baseline.json', 'third-party/baselines/android-debug.cdx.json', 'scripts/check_gradle_verification.py', 'scripts/test_check_gradle_verification.py', 'scripts/test_gradle_checksum_gate.sh', 'scripts/dependency_license_evidence.py', 'scripts/test_dependency_license_evidence.py', 'scripts/artifact_manifest.py', 'scripts/test_artifact_manifest.py', 'scripts/build_source_evidence.py', 'scripts/test_build_source_evidence.py', 'scripts/code_audit.py', 'scripts/test_code_audit.py', 'scripts/run_offline_qa.py', 'scripts/test_run_offline_qa.py', 'scripts/qa_case_inventory.py', 'scripts/test_qa_case_inventory.py', 'scripts/verify_offline_qa.py', 'scripts/test_verify_offline_qa.py', 'scripts/plan_windows_maintenance.py', 'scripts/test_plan_windows_maintenance.py', 'scripts/backup_windows_selection.py', 'scripts/test_backup_windows_selection.py', 'scripts/restore_windows_selection.py', 'scripts/test_restore_windows_selection.py', 'scripts/windows_maintenance_lease.py', 'scripts/test_windows_maintenance_lease.py', 'scripts/smoke_maintenance_lease_interop.py', 'scripts/probe_maintenance_lease.py', 'scripts/test_probe_maintenance_lease.py', 'config/python-qa-cases.json', 'scripts/record_okhttp_bytecode.py', 'scripts/test_record_okhttp_bytecode.py', 'config/code-audit-baseline.json']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Run shared Python offline QA
        run: python scripts/run_offline_qa.py --output offline-qa
      - name: Independently verify and seal offline QA evidence
        run: |
          python scripts/verify_offline_qa.py --report offline-qa
          python scripts/artifact_manifest.py write offline-qa
          python scripts/artifact_manifest.py verify offline-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-offline-qa
          path: offline-qa/
          if-no-files-found: error
      - name: Record actual Git source checkout before build
        run: |
          python3 -m unittest discover -s scripts -p test_build_source_evidence.py -v
          python3 scripts/build_source_evidence.py build-source.json
      - name: Native client policy fixtures
        run: |
          mkdir -p /tmp/veypanel-client-tests
          javac -d /tmp/veypanel-client-tests android/app/src/main/java/com/veypanel/client/{ReaderSession,SampleRules,InvitationLink,SavedReader,ConnectionDiagnostics,BoundedStreamState,BoundedFrameHeader,BoundedMessageReader,BoundedUpgrade,MaskedClientFrame,WssControl,TouchMath,LocalTouchProbe,LocalTapGate,LocalPreviewLease,LatestTelemetryMailbox,TransportFailure,BoundedRestBody}.java android/tests/ClientPolicySmoke.java android/tests/BoundedStreamStateSmoke.java android/tests/FrameHeaderSmoke.java android/tests/MessageReaderSmoke.java android/tests/UpgradeSmoke.java android/tests/TouchMathSmoke.java android/tests/LocalTouchProbeSmoke.java android/tests/LocalTapGateSmoke.java android/tests/LocalPreviewLeaseSmoke.java android/tests/LatestTelemetryMailboxSmoke.java android/tests/TransportFailureSmoke.java android/tests/BoundedRestBodySmoke.java
          java -cp /tmp/veypanel-client-tests com.veypanel.client.ClientPolicySmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.BoundedStreamStateSmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.LocalTapGateSmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.LocalPreviewLeaseSmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.LatestTelemetryMailboxSmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.TransportFailureSmoke
          java -cp /tmp/veypanel-client-tests com.veypanel.client.BoundedRestBodySmoke
      - name: Verify offline APK integrity policy fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*android*.py' -v
      - name: Dependency inventory fixtures
        run: |
          python3 -m unittest discover -s scripts -p test_dependency_inventory.py -v
          python3 -m unittest discover -s scripts -p test_check_dependency_baseline.py -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify selected JDK and Gradle versions
        run: |
          java -version 2>&1 | tee /tmp/veypanel-java-version.txt
          grep -F '17.0.21' /tmp/veypanel-java-version.txt
          grep -F '+9' /tmp/veypanel-java-version.txt
          gradle --version | tee /tmp/veypanel-gradle-version.txt
          grep -Fx 'Gradle 8.9' /tmp/veypanel-gradle-version.txt
      - name: Prepare Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - name: Verify committed Gradle checksum metadata policy
        run: |
          python3 -m unittest discover -s scripts -p test_check_gradle_verification.py -v
          python3 scripts/check_gradle_verification.py android/gradle/verification-metadata.xml third-party/baselines/android-debug.cdx.json
      - name: Build debug APK and lint with strict dependency verification
        working-directory: android
        run: gradle --no-daemon --dependency-verification strict :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug :app:writeDebugDependencyInventory
      - name: Confirm Gradle can reproduce the committed runtime lock
        working-directory: android
        run: |
          gradle --no-daemon --dependency-verification strict :app:writeDebugDependencyInventory --write-locks
          git diff --exit-code -- app/gradle.lockfile gradle/verification-metadata.xml
      - name: Prove strict Gradle rejects an incorrect dependency checksum
        run: |
          bash scripts/test_gradle_checksum_gate.sh
          git diff --exit-code -- android/gradle/verification-metadata.xml
      - name: Record resolved Android runtime component inventory
        run: python3 scripts/dependency_inventory.py maven android/app/build/reports/dependencies/debug-runtime.json android/app/build/outputs/apk/debug/runtime-components.cdx.json --label VeyPanel-Android-debug
      - name: Reject unreviewed Android dependency drift
        run: python3 scripts/check_dependency_baseline.py third-party/baselines/android-debug.cdx.json android/app/build/outputs/apk/debug/runtime-components.cdx.json
      - name: Capture license evidence from verified Android runtime artifacts
        run: |
          python3 -m unittest discover -s scripts -p test_dependency_license_evidence.py -v
          python3 scripts/dependency_license_evidence.py maven third-party/baselines/android-debug.cdx.json android/gradle/verification-metadata.xml android/app/build/outputs/apk/debug/dependency-license-evidence.json
      - name: Capture pinned OkHttp static bytecode evidence
        run: |
          python3 scripts/record_okhttp_bytecode.py --metadata android/gradle/verification-metadata.xml --output okhttp-bytecode-evidence
          cp build-source.json okhttp-bytecode-evidence/
          python3 scripts/artifact_manifest.py write okhttp-bytecode-evidence
          python3 scripts/artifact_manifest.py verify okhttp-bytecode-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: okhttp-wss-static-evidence
          path: okhttp-bytecode-evidence/
          if-no-files-found: error
      - name: Record build toolchain evidence
        run: |
          out=android/app/build/outputs/apk/debug/build-toolchain.txt
          {
            java -version 2>&1
            gradle --version
            for package in platforms/android-35 build-tools/35.0.0 platform-tools; do
              echo "=== Android SDK $package ==="
              grep -E '^(Pkg.Desc|Pkg.Revision|AndroidVersion.ApiLevel)=' "$ANDROID_HOME/$package/source.properties"
            done
          } > "$out"
      - name: Verify built APK structure and debug signing
        run: |
          python3 scripts/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/apk-integrity.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/apk-signing.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk > android/app/build/outputs/apk/debug/apk-badging.txt
          python3 scripts/check_android_badging.py android/app/build/outputs/apk/debug/apk-badging.txt android/app/build.gradle | tee android/app/build/outputs/apk/debug/apk-identity.txt
      - name: Deliberately fail a report pipeline
        id: negative_pipeline
        continue-on-error: true
        run: |
          (exit 23) | tee /tmp/veypanel-negative-pipeline.txt
      - name: Require report pipeline rejection and exercise negative APK gates
        env:
          NEGATIVE_OUTCOME: ${{ steps.negative_pipeline.outcome }}
        run: |
          test "$NEGATIVE_OUTCOME" = failure
          bash scripts/test_apk_failure_gates.sh android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/apk-badging.txt android/app/build.gradle "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Stage and verify exact Android artifact file set
        run: |
          python3 -m unittest discover -s scripts -p test_artifact_manifest.py -v
          python3 scripts/build_source_evidence.py build-source.json --verify
          mkdir -p android-artifact
          cp build-source.json android-artifact/
          cp android/app/build/outputs/apk/debug/{app-debug.apk,apk-integrity.txt,apk-signing.txt,apk-badging.txt,apk-identity.txt,runtime-components.cdx.json,build-toolchain.txt,dependency-license-evidence.json} android-artifact/
          python3 scripts/artifact_manifest.py write android-artifact
          python3 scripts/artifact_manifest.py verify android-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-android-monitor-debug
          path: android-artifact/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-android-keystore-test
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
