name: Android CI
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/verify_android_apk.py', 'scripts/test_verify_android_apk.py']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', 'scripts/verify_android_apk.py', 'scripts/test_verify_android_apk.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Native client policy fixtures
        run: |
          mkdir -p /tmp/veypanel-client-tests
          javac -d /tmp/veypanel-client-tests android/app/src/main/java/com/veypanel/client/{ReaderSession,SampleRules,InvitationLink,SavedReader,ConnectionDiagnostics,BoundedFrameHeader,BoundedMessageReader,BoundedUpgrade,MaskedClientFrame,WssControl,TouchMath,LocalTouchProbe}.java android/tests/ClientPolicySmoke.java android/tests/FrameHeaderSmoke.java android/tests/MessageReaderSmoke.java android/tests/UpgradeSmoke.java android/tests/TouchMathSmoke.java android/tests/LocalTouchProbeSmoke.java
          java -cp /tmp/veypanel-client-tests com.veypanel.client.ClientPolicySmoke
      - name: Verify offline APK integrity policy fixtures
        run: python3 -m unittest discover -s scripts -p test_verify_android_apk.py -v
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf # v4.0.2
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Build debug APK and lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Verify built APK structure and debug signing
        run: |
          python3 scripts/verify_android_apk.py android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/apk-integrity.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/apk-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-android-monitor-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/apk-integrity.txt
            android/app/build/outputs/apk/debug/apk-signing.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-android-keystore-test
          path: android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
