name: Android runtime smoke
on:
  push:
    paths: ['android/**', '.github/workflows/android-runtime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keystore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@7731365548f3f81c15d4c49c8f1d29101e02cdcf
        with:
          cmdline-tools-version: '14742923'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Select emulator acceleration
        id: acceleration
        run: |
          if test -c /dev/kvm; then
            sudo chmod a+rw /dev/kvm
          fi
          if test -r /dev/kvm && test -w /dev/kvm; then
            echo 'software=false' >> "$GITHUB_OUTPUT"
            echo 'KVM available'
          else
            echo 'software=true' >> "$GITHUB_OUTPUT"
            echo 'KVM unavailable; run software emulator (no test skipped)'
          fi
      - name: Validate runtime script syntax
        run: bash -n android/tests/run-runtime-smoke.sh
      - name: Build isolated test packages
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Execute actual AndroidKeyStore and synthetic offline QR smoke
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 33
          disable-linux-hw-accel: ${{ steps.acceleration.outputs.software }}
          emulator-boot-timeout: 1200
          target: google_apis
          arch: x86_64
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none'
          script: bash android/tests/run-runtime-smoke.sh
