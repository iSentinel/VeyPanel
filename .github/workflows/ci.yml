name: Windows CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify exact build tool versions
        run: |
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'Unexpected .NET SDK' }
          if ((python --version).Trim() -ne 'Python 3.12.10') { throw 'Unexpected Python version' }
      - name: Dependency inventory fixtures
        run: |
          python -m unittest discover -s scripts -p test_dependency_inventory.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_check_dependency_baseline.py -v
      - name: Check dashboard JavaScript syntax
        run: |
          node --check src/VeyPanel.Host/wwwroot/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/VeyPanel.Host/wwwroot/enroll.js
      - run: dotnet build src/VeyPanel.Host -c Release
      - run: dotnet run --project tests/VeyPanel.Smoke -c Release
      - run: dotnet publish src/VeyPanel.Host -c Release -r win-x64 --self-contained true -o publish
      - name: Verify Windows Host NuGet locked restore
        run: |
          dotnet restore src/VeyPanel.Host -r win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/VeyPanel.Host/packages.lock.json
      - name: Record restored Windows Host package inventory
        run: python scripts/dependency_inventory.py nuget src/VeyPanel.Host/obj/project.assets.json publish/runtime-components.cdx.json --label VeyPanel-Host-win-x64
      - name: Reject unreviewed Windows Host dependency drift
        run: python scripts/check_dependency_baseline.py third-party/baselines/host-win-x64.cdx.json publish/runtime-components.cdx.json
      - name: Test storage provider diagnostic fixtures
        shell: pwsh
        run: ./scripts/Test-StorageHealth.ps1
      - name: Run published Windows host integration smoke
        shell: pwsh
        run: ./scripts/Test-Host.ps1
      - name: Run HTTPS LAN integration smoke
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --lan-smoke publish
      - name: Test WebSocket telemetry
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --ws-smoke publish
      - name: Test device token lifecycle
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --device-smoke publish
      - name: Test protected Host process restart
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --persistent-smoke publish
      - name: Test managed Host lifecycle
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --lifecycle-smoke publish
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-host-win-x64-alpha
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-host-nuget-lock
          path: src/VeyPanel.Host/packages.lock.json
          if-no-files-found: error
      - name: Publish desktop diagnostic UI
        run: dotnet publish src/VeyPanel.Desktop -c Release -r win-x64 --self-contained true -o publish-desktop
      - name: Bundle Host with Desktop
        shell: pwsh
        run: Copy-Item -Path publish -Destination publish-desktop/host -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-desktop-win-x64-alpha
          path: publish-desktop/
