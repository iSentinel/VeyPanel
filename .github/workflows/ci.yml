name: Windows CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify exact build tool versions
        run: |
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'Unexpected .NET SDK' }
          if ((python --version).Trim() -ne 'Python 3.12.10') { throw 'Unexpected Python version' }
      - name: Run shared Python offline QA
        run: python scripts/run_offline_qa.py --output offline-qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-offline-qa
          path: offline-qa/
          if-no-files-found: error
      - name: Record actual Git source checkout before build
        run: |
          python -m unittest discover -s scripts -p test_build_source_evidence.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_source_evidence.py build-source.json
      - name: Dependency inventory fixtures
        run: |
          python -m unittest discover -s scripts -p test_dependency_inventory.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_check_dependency_baseline.py -v
      - name: Check dashboard JavaScript syntax
        run: |
          node --check src/VeyPanel.Host/wwwroot/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check src/VeyPanel.Host/wwwroot/enroll.js
      - run: dotnet build src/VeyPanel.Host -c Release
      - run: dotnet run --project tests/VeyPanel.Smoke -c Release
      - run: dotnet publish src/VeyPanel.Host -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true -o publish
      - name: Apply verified deterministic Host endpoint metadata
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_normalize_static_endpoints.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path publication-evidence -Force | Out-Null
          Copy-Item publish/VeyPanel.Host.staticwebassets.endpoints.json publication-evidence/raw-static-endpoints.json
          $source = Get-Content build-source.json -Raw | ConvertFrom-Json
          python scripts/normalize_static_endpoints.py publish/VeyPanel.Host.staticwebassets.endpoints.json --epoch $source.source_commit_epoch_utc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish/VeyPanel.Host.staticwebassets.endpoints.json publication-evidence/normalized-static-endpoints.json
          Copy-Item build-source.json publication-evidence/build-source.json
          python scripts/artifact_manifest.py write publication-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify publication-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-host-publication-evidence
          path: publication-evidence/
          if-no-files-found: error
      - name: Record Windows build toolchain evidence
        shell: pwsh
        run: |
          @("dotnet SDK: $(dotnet --version)", "Python: $(python --version)",
            "Runner image: $env:ImageOS / $env:ImageVersion") |
            Set-Content -Encoding utf8 publish/build-toolchain.txt
      - name: Verify Windows Host NuGet locked restore
        run: |
          dotnet restore src/VeyPanel.Host -r win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/VeyPanel.Host/packages.lock.json
      - name: Record restored Windows Host package inventory
        run: python scripts/dependency_inventory.py nuget src/VeyPanel.Host/obj/project.assets.json publish/runtime-components.cdx.json --label VeyPanel-Host-win-x64
      - name: Reject unreviewed Windows Host dependency drift
        run: python scripts/check_dependency_baseline.py third-party/baselines/host-win-x64.cdx.json publish/runtime-components.cdx.json
      - name: Capture license evidence from verified NuGet packages
        run: |
          python -m unittest discover -s scripts -p test_dependency_license_evidence.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/dependency_license_evidence.py nuget third-party/baselines/host-win-x64.cdx.json src/VeyPanel.Host/packages.lock.json publish/dependency-license-evidence.json
      - name: Test storage provider diagnostic fixtures
        shell: pwsh
        run: ./scripts/Test-StorageHealth.ps1
      - name: Test private Host bootstrap capture
        shell: pwsh
        run: ./scripts/Test-HostSmokeCapture.ps1
      - name: Run published Windows host integration smoke
        shell: pwsh
        run: ./scripts/Test-Host.ps1
      - name: Run HTTPS LAN integration smoke
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --lan-smoke publish
      - name: Test WebSocket telemetry
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --ws-smoke publish
      - name: Test device token lifecycle
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --device-smoke publish
      - name: Test protected Host process restart
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --persistent-smoke publish
      - name: Test managed Host lifecycle
        run: dotnet run --project tests/VeyPanel.Smoke -c Release -- --lifecycle-smoke publish
      - name: Verify published Host artifact file manifest
        run: |
          python -m unittest discover -s scripts -p test_artifact_manifest.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_source_evidence.py build-source.json --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-source.json publish/build-source.json
          python scripts/artifact_manifest.py write publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify publish
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-host-win-x64-alpha
          path: publish/
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-host-nuget-lock
          path: src/VeyPanel.Host/packages.lock.json
          if-no-files-found: error
      - name: Publish desktop diagnostic UI
        run: dotnet publish src/VeyPanel.Desktop -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true -o publish-desktop
      - name: Bundle Host with Desktop
        shell: pwsh
        run: Copy-Item -Path publish -Destination publish-desktop/host -Recurse
      - name: Verify published Desktop artifact file manifest
        run: |
          python scripts/build_source_evidence.py build-source.json --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-source.json publish-desktop/build-source.json
          python scripts/artifact_manifest.py write publish-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify publish-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-desktop-win-x64-alpha
          path: publish-desktop/

      - name: Package and verify unsigned portable Desktop ZIP
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_portable_zip.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path portable | Out-Null
          python scripts/artifact_manifest.py verify publish-desktop/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/portable_zip.py write publish-desktop portable/VeyPanel-win-x64-portable.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash portable/VeyPanel-win-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path portable/SHA256SUMS.txt -Encoding ascii -Value "$digest  VeyPanel-win-x64-portable.zip"
          Expand-Archive -LiteralPath portable/VeyPanel-win-x64-portable.zip -DestinationPath extracted
          python scripts/artifact_manifest.py verify extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify extracted/host
      - name: Verify digest-pinned portable package dry-run and staging
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_stage_windows_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = 'portable/VeyPanel-win-x64-portable.zip'
          $digest = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          python scripts/stage_windows_package.py $package --sha256 $digest --destination staged-package --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path staged-package) { throw 'Dry-run created destination' }
          python scripts/stage_windows_package.py $package --sha256 $digest --destination staged-package --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify staged-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify staged-package/host
      - name: Verify atomic side-by-side package selection
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_windows_package_selection.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = 'portable/VeyPanel-win-x64-portable.zip'
          $digest = (Get-FileHash $package -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path selection-test | Out-Null
          python scripts/windows_package_selection.py --root selection-test select $package --sha256 $digest --dry-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Get-ChildItem selection-test -Force).Count -ne 0) { throw 'Dry-run mutated root' }
          python scripts/windows_package_selection.py --root selection-test select $package --sha256 $digest --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $before = (Get-FileHash selection-test/selection.json).Hash
          python scripts/windows_package_selection.py --root selection-test select $package --sha256 $digest --apply
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash selection-test/selection.json).Hash -ne $before) { throw 'Idempotent selection modified state' }
          python scripts/windows_package_selection.py --root selection-test status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $state = Get-Content selection-test/selection.json -Raw | ConvertFrom-Json
          if ($state.active.package_sha256 -ne $digest -or $null -ne $state.previous) { throw 'Unexpected first selection' }
          python scripts/artifact_manifest.py verify "selection-test/versions/$digest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify "selection-test/versions/$digest/host"
      - uses: actions/upload-artifact@v4
        with:
          name: veypanel-win-x64-portable-unsigned
          path: portable/
          if-no-files-found: error
