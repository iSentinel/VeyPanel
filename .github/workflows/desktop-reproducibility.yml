name: Desktop exact-checkout reproduction
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/VeyPanel.Host/**'
      - 'src/VeyPanel.Desktop/**'
      - 'src/Shared/**'
      - 'scripts/build_source_evidence.py'
      - 'global.json'
      - 'scripts/artifact_manifest.py'
      - 'scripts/Test-Host.ps1'
      - 'scripts/HostSmokeCapture.psm1'
      - 'scripts/Test-HostSmokeCapture.ps1'
      - 'scripts/portable_zip.py'
      - 'scripts/test_portable_zip.py'
      - 'scripts/normalize_static_endpoints.py'
      - 'scripts/test_normalize_static_endpoints.py'
      - '.github/workflows/desktop-reproducibility.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        copy: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Record exact checkout
        shell: pwsh
        run: |
          New-Item -ItemType Directory evidence | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          if ($sha -ne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          Set-Content -Path evidence/checkout.txt -Encoding utf8 -NoNewline -Value ($sha + "`n" + $tree + "`n")
          if ((dotnet --version).Trim() -ne '10.0.404') { throw 'SDK mismatch' }
      - name: Locked deterministic Host publish
        run: |
          dotnet publish src/VeyPanel.Host -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- src/VeyPanel.Host/packages.lock.json
      - name: Normalize Host output and verify runtime
        shell: pwsh
        run: |
          $epoch = (git log -1 --format=%ct HEAD).Trim()
          python scripts/normalize_static_endpoints.py publish/VeyPanel.Host.staticwebassets.endpoints.json --epoch $epoch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py write publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Test-Host.ps1 -PublishDirectory publish
          python scripts/artifact_manifest.py verify publish
      - name: Build Desktop and bundle verified Host
        shell: pwsh
        run: |
          dotnet publish src/VeyPanel.Desktop -c Release -r win-x64 --self-contained true -p:ContinuousIntegrationBuild=true -o publish-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Path publish -Destination publish-desktop/host -Recurse
          foreach ($name in @('VeyPanel.Desktop.exe','VeyPanel.Desktop.dll','VeyPanel.Desktop.pdb','host/VeyPanel.Host.exe')) {
            if (-not (Test-Path (Join-Path publish-desktop $name) -PathType Leaf)) { throw "Missing Desktop bundle file: $name" }
          }
          python scripts/artifact_manifest.py verify publish-desktop/host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_source_evidence.py publish-desktop/build-source.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py write publish-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify publish-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item publish-desktop/artifact-files.sha256.json evidence/desktop.json
          Copy-Item publish-desktop/build-source.json evidence/build-source.json
      - name: Build and verify deterministic portable ZIP
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p test_portable_zip.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/portable_zip.py write publish-desktop desktop-portable.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $digest = (Get-FileHash desktop-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path evidence/portable-sha256.txt -Encoding utf8 -NoNewline -Value $digest
          Expand-Archive -LiteralPath desktop-portable.zip -DestinationPath extracted
          python scripts/artifact_manifest.py verify extracted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/artifact_manifest.py verify extracted/host
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-reproduction-${{ matrix.copy }}
          path: evidence/
          if-no-files-found: error
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-reproduction-*
          path: reproduction
      - name: Compare complete Desktop bundle manifests
        shell: bash
        run: |
          set -o pipefail
          a=reproduction/desktop-reproduction-a
          b=reproduction/desktop-reproduction-b
          diff -u "$a/checkout.txt" "$b/checkout.txt"
          test "$(head -n 1 "$a/checkout.txt")" = "$GITHUB_SHA"
          diff -u "$a/build-source.json" "$b/build-source.json"
          python3 scripts/artifact_manifest.py compare "$a/desktop.json" "$b/desktop.json" | tee desktop-comparison.txt
          diff -u "$a/portable-sha256.txt" "$b/portable-sha256.txt"
          printf 'PASS: independent portable ZIP SHA-256: %s\n' "$(cat "$a/portable-sha256.txt")" | tee -a desktop-comparison.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-reproduction-comparison
          path: desktop-comparison.txt
          if-no-files-found: warn
