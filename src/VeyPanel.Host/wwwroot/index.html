<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VeyPanel</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head>
<body><main><header><div><h1>VeyPanel</h1><p>Windows Telemetry · alpha</p></div><span id="status" role="status">Connecting</span></header>
<section class="cards" aria-label="System resources"><article><h2>CPU utilization</h2><strong id="cpu">N/A</strong><progress id="cpu-bar" max="100" aria-label="CPU utilization"></progress></article><article><h2>Physical memory</h2><strong id="ram">N/A</strong><progress id="ram-bar" max="100" aria-label="RAM utilization"></progress><p id="capacity">N/A</p></article></section>
<section class="history"><h2>CPU / RAM · last 60 samples</h2><canvas id="chart" role="img" aria-label="CPU and memory utilization history"></canvas><p><span class="cpu-key">CPU</span> · <span class="ram-key">RAM</span></p></section><footer id="timestamp">No sample yet</footer></main></body></html>
