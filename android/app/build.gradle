plugins { id 'com.android.application' }
android {
    namespace 'com.veypanel.client'
    compileSdk 35
    defaultConfig {
        applicationId 'com.veypanel.client'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'com.veypanel.client.StoreInstrumentation'
        versionCode 11
        versionName '0.1.0-alpha.11'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        version { strictly '4.3.0' }
    }
    implementation('com.google.zxing:core:3.5.3') {
        version { strictly '3.5.3' }
    }
}
