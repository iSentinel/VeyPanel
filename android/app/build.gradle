plugins { id 'com.android.application' }
android {
    namespace 'com.veypanel.client'
    compileSdk 35
    defaultConfig {
        applicationId 'com.veypanel.client'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'com.veypanel.client.StoreInstrumentation'
        versionCode 18
        versionName '0.1.0-alpha.18'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        version { strictly '4.3.0' }
    }
    implementation('com.google.zxing:core:3.5.3') {
        version { strictly '3.5.3' }
    }
}

dependencies {
    implementation('com.squareup.okhttp3:okhttp:4.12.1') {
        version { strictly '4.12.1' }
    }
}

// Record the actual selected runtime graph without changing dependency resolution.
tasks.register('writeDebugDependencyInventory') {
    doLast {
        def result = configurations.debugRuntimeClasspath.incoming.resolutionResult
        def unresolved = result.allDependencies.findAll {
            it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
        }
        if (!unresolved.empty) throw new GradleException('Unresolved runtime dependencies')
        def modules = result.allComponents.collect { it.id }.findAll {
            it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
        }.collect { [group: it.group, name: it.module, version: it.version] }
        modules.sort { a, b -> (a.group + ':' + a.name) <=> (b.group + ':' + b.name) }
        def output = layout.buildDirectory.file('reports/dependencies/debug-runtime.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules)) + '\n'
        if (modules.empty) throw new GradleException('Runtime inventory is empty')
    }
}
